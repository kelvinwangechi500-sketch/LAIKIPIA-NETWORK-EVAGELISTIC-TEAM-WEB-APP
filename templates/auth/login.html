<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Network LU Unit App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/static/img/logo-192.png">
<link rel="apple-touch-icon" href="/static/img/logo-192.png">
<meta name="theme-color" content="#B91C1C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LU Unit App">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Sans 3",sans-serif;min-height:100vh;background:#111827;display:flex;align-items:center;justify-content:center;padding:20px}
.login-wrap{width:100%;max-width:440px}
.login-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.4)}
.login-header{background:linear-gradient(160deg,#7F1D1D 0%,#111827 100%);padding:36px 40px 32px;text-align:center}
.login-header img{width:80px;height:80px;border-radius:50%;border:3px solid rgba(255,255,255,.3);margin-bottom:16px;object-fit:cover}
.login-header h1{font-family:"Playfair Display",serif;color:#fff;font-size:22px;line-height:1.3;margin-bottom:4px}
.login-header p{color:rgba(255,255,255,.5);font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.login-body{padding:36px 40px}
.flash{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;border-left:4px solid}
.flash.success{background:#d1fae5;border-color:#065f46;color:#064e3b}
.flash.danger{background:#fee2e2;border-color:#B91C1C;color:#7F1D1D}
.flash.warning{background:#fef3c7;border-color:#92400e;color:#78350f}
.flash.info{background:#dbeafe;border-color:#1e40af;color:#1e3a8a}
label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px}
input{width:100%;padding:11px 14px;border-radius:8px;border:1px solid #E5E7EB;font-size:14px;font-family:inherit;background:#F3F4F6;outline:none;transition:.2s;margin-bottom:16px}
input:focus{border-color:#B91C1C;background:#fff;box-shadow:0 0 0 3px rgba(185,28,28,.08)}
@media(max-width:480px){body{padding:10px}.login-header{padding:24px 20px 22px}.login-header img{width:64px;height:64px;margin-bottom:12px}.login-header h1{font-size:19px}.login-body{padding:24px 18px}.login-footer{padding:0 18px 22px}input{font-size:16px}.btn{min-height:44px}}
.btn{width:100%;padding:12px;border-radius:8px;background:#B91C1C;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s;margin-top:4px}
.btn:hover{background:#7F1D1D;transform:translateY(-1px);box-shadow:0 4px 14px rgba(185,28,28,.35)}
.login-footer{text-align:center;padding:0 40px 28px;font-size:12px;color:#9CA3AF}
.divider{height:1px;background:#E5E7EB;margin:20px 0}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <img src="/static/img/logo.png" alt="Network Evangelistic Team logo">
      <h1>Network Evangelistic Team</h1>
      <p>Management Platform</p>
    </div>
    <div class="login-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
      {% endwith %}
      <form method="POST" action="{{ url_for('auth.login') }}">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="you@net.org" autocomplete="email">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••" autocomplete="current-password">
        <button type="submit" class="btn">Sign In →</button>
      </form>
    </div>
    <div class="login-footer">
      <div class="divider"></div>
      Don&apos;t have an account? <a href="{{ url_for('auth.register') }}" style="color:#B91C1C;font-weight:600;text-decoration:none">Register here</a><br>
      &copy; Network Evangelistic Team Platform
    </div>
  </div>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(r => console.log('SW registered:', r.scope))
      .catch(e => console.log('SW error:', e));
  });
}
</script>
</body>
</html>
